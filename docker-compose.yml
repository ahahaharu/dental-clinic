services:
  mysql:
    image: mysql:8.4
    container_name: dental-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
      # Выполняется только при первом запуске (пока volume пустой)
      - ./dental_clinic.sql:/docker-entrypoint-initdb.d/01-dental_clinic.sql:ro
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uroot', '-proot']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: dental-redis
    restart: unless-stopped
    ports:
      - '6379:6379'

  mongo:
    image: mongo:7
    container_name: dental-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db

volumes:
  mysql_data:
  mongo_data:
